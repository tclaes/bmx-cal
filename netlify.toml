# Netlify build settings. See docs/deploy.md.
# Response headers live in public/_headers and the SPA fallback in public/_redirects;
# Netlify reads both from the published folder, so they are not repeated here.
# The Node version comes from .nvmrc.

[build]
  command = "npm run build"
  publish = "dist"

# Netlify's secrets scan treats every env var as a secret. The VITE_* values are
# public by design (Vite inlines them into the client bundle) and also appear in
# the repo (push.service.ts fallback key, cron migrations), so they are excluded.
# Never add server-side keys such as SUPABASE_SERVICE_ROLE_KEY to this list.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_VAPID_PUBLIC_KEY,VITE_GA_MEASUREMENT_ID"

# Deploy previews and branch deploys must not send traffic to Google Analytics.
# With an empty measurement ID the build drops the gtag tag from index.html
# (vite.config.ts, plugin analytics-tag) and src/shared/utils/analytics.ts sends nothing.
[context.deploy-preview.environment]
  VITE_GA_MEASUREMENT_ID = ""

[context.branch-deploy.environment]
  VITE_GA_MEASUREMENT_ID = ""
