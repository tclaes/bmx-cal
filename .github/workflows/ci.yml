name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feat/**', 'fix/**']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Module boundaries
        run: npm run sheriff

      - name: Lint styles
        run: npm run stylelint

      - name: Check module boundaries
        run: npm run sheriff

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
